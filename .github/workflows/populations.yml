name: Update country populations
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Finish each publication so overlapping schedules cannot race to replace the reference.
  group: population-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/populations.test.js
      # Only the restricted reference-data account is available to this publishing step.
      - run: node scripts/update-populations.mjs --publish
        env:
          POPULATION_UPDATER_EMAIL: ${{ secrets.POPULATION_UPDATER_EMAIL }}
          POPULATION_UPDATER_PASSWORD: ${{ secrets.POPULATION_UPDATER_PASSWORD }}
